name: Build Android APK (Argon Mobile Agent)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK for Easy Mobile Download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Argon-GitHub-Agent.apk

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Argon-GitHub-Agent-APK
          path: Argon-GitHub-Agent.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0-latest
          name: "Argon 4.0 Android App (APK)"
          body: "Download and tap **Argon-GitHub-Agent.apk** below on your Android phone to install the native pitch-black Argon GitHub & Gemini Agent app."
          files: Argon-GitHub-Agent.apk
          prerelease: false
